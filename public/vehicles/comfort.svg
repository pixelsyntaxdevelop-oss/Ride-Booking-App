<svg viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle Ground Ambient Contact Shadow -->
  <ellipse cx="200" cy="190" rx="165" ry="18" fill="rgba(15, 23, 42, 0.28)" filter="blur(6px)" />
  <ellipse cx="195" cy="188" rx="135" ry="12" fill="rgba(15, 23, 42, 0.42)" filter="blur(2px)" />

  <!-- Rear Wheel Assembly -->
  <g id="rear-wheel">
    <circle cx="102" cy="165" r="33" fill="#020617" />
    <circle cx="102" cy="165" r="24" fill="#0F172A" />
    <!-- Luxury Diamond Cut M-Alloy Multi-spoke -->
    <circle cx="102" cy="165" r="18" fill="#1E293B" stroke="#CBD5E1" stroke-width="2.5" />
    <path d="M102 147V183 M84 165H120 M89 152L115 178 M115 152L89 178 M92 160L112 170 M92 170L112 160" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" />
    <circle cx="102" cy="165" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <!-- Gold Performance Caliper -->
    <path d="M93 149C89 153 87 159 87 165" stroke="#F59E0B" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Front Wheel Assembly -->
  <g id="front-wheel">
    <circle cx="298" cy="165" r="33" fill="#020617" />
    <circle cx="298" cy="165" r="24" fill="#0F172A" />
    <!-- Luxury Diamond Cut M-Alloy Multi-spoke -->
    <circle cx="298" cy="165" r="18" fill="#1E293B" stroke="#CBD5E1" stroke-width="2.5" />
    <path d="M298 147V183 M280 165H316 M285 152L311 178 M311 152L285 178 M288 160L308 170 M288 170L308 160" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" />
    <circle cx="298" cy="165" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
    <!-- Gold Performance Caliper -->
    <path d="M289 149C285 153 283 159 283 165" stroke="#F59E0B" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Main Executive Sedan Body (Deep Obsidian & Metallic Graphite) -->
  <g id="car-body">
    <!-- Underbody Structure -->
    <path d="M75 162H128C134 151 146 144 160 144H240C254 144 266 151 272 162H328C338 162 346 153 344 142L338 122L326 102C314 92 292 88 268 88H135C106 88 86 96 72 110L50 128C44 135 42 144 45 152C48 160 55 162 65 162H75Z" fill="#020617" />

    <!-- Exterior Body Shell - Executive Graphite -->
    <path d="M48 144C46 134 52 125 60 119L100 93C116 82 134 76 154 74L222 68C244 68 262 74 278 86L324 113C340 122 352 130 360 140L362 145C366 150 362 160 354 160H324C320 148 310 140 298 140C285 140 275 148 271 160H130C126 148 116 140 102 140C89 140 79 148 75 160H56C50 160 46 154 48 144Z" fill="url(#graphiteMetallic)" />

    <!-- Sharp German Executive Character Line & Chrome Strip -->
    <path d="M68 118L104 95C118 86 135 80 152 78L220 72C238 72 254 78 266 88L312 113C326 120 338 126 348 134" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- Lower Chrome Rocker Panel Accent -->
    <path d="M136 156H266" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

    <!-- Shoulder crease -->
    <path d="M66 124C112 122 222 118 352 124" stroke="#475569" stroke-width="2" />
    <path d="M66 123C112 121 222 117 352 123" stroke="#94A3B8" stroke-width="0.8" />

    <!-- Executive Greenhouse (Side Windows) with Chrome Surround -->
    <path d="M125 90L160 49C168 39 181 33 194 33H245C258 33 270 39 278 49L304 88H125Z" fill="#090D16" />
    <!-- Privacy Tinted Glass -->
    <path d="M133 86L164 51C170 43 180 39 191 39H216V86H133Z" fill="url(#glassCharcoalTint)" />
    <path d="M224 39H243C252 39 262 43 267 51L294 86H224V39Z" fill="url(#glassCharcoalTint)" />

    <!-- Pillars with high gloss shadow -->
    <path d="M220 36V86" stroke="#090D16" stroke-width="4" />
    <path d="M162 50L131 86" stroke="#090D16" stroke-width="3" />
    <path d="M272 50L298 86" stroke="#090D16" stroke-width="3" />

    <!-- Full Chrome Window Framing -->
    <path d="M122 88L158 47C167 37 180 31 194 31H245C260 31 272 37 280 47L308 88" stroke="#F1F5F9" stroke-width="2.2" fill="none" />

    <!-- Executive Side Mirror with Turn Signal -->
    <path d="M170 80L155 82C151 83 149 86 151 89C153 92 157 93 161 91L172 86V80Z" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2" />
    <path d="M156 86L166 84" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />

    <!-- Door Seams & Illuminated Handles -->
    <path d="M190 90V146" stroke="#334155" stroke-width="1.5" />
    <path d="M256 90V146" stroke="#334155" stroke-width="1.5" />
    <rect x="198" y="110" width="18" height="4.5" rx="2" fill="#E2E8F0" />
    <rect x="264" y="110" width="18" height="4.5" rx="2" fill="#E2E8F0" />

    <!-- Luxury Laser Headlamp with Gold/Amber DRL Accent -->
    <path d="M340 124L358 131C362 133 363 137 360 140L348 142C342 142 336 138 334 132L332 126L340 124Z" fill="#F8FAFC" />
    <path d="M336 126L358 133" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="352" cy="134" r="2.8" fill="#FDE68A" />

    <!-- Twin L-Shaped Executive LED Taillight -->
    <path d="M46 140L58 138C62 137 66 139 66 142V146C66 148 62 150 58 150L44 148L46 140Z" fill="#991B1B" />
    <path d="M44 144H60" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" />

    <!-- Front Luxury Kidney Air Intake Strakes -->
    <path d="M348 144L352 154C352 156 349 158 346 158H338L335 146L348 144Z" fill="#090D16" />
    <path d="M338 152H348" stroke="#F59E0B" stroke-width="1.2" />
  </g>

  <!-- Gradients & Lighting Definitions -->
  <defs>
    <linearGradient id="graphiteMetallic" x1="50" y1="40" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="65%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="glassCharcoalTint" x1="150" y1="35" x2="280" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9" />
    </linearGradient>
  </defs>
</svg>
