<svg viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle Ground Ambient Contact Shadow -->
  <ellipse cx="200" cy="190" rx="160" ry="18" fill="rgba(15, 23, 42, 0.22)" filter="blur(6px)" />
  <ellipse cx="195" cy="188" rx="130" ry="12" fill="rgba(15, 23, 42, 0.35)" filter="blur(2px)" />

  <!-- Rear Wheel Assembly -->
  <g id="rear-wheel">
    <circle cx="105" cy="165" r="32" fill="#090D16" />
    <circle cx="105" cy="165" r="23" fill="#1E293B" />
    <!-- Sport Aero Alloy Spokes -->
    <circle cx="105" cy="165" r="17" fill="#334155" stroke="#94A3B8" stroke-width="3" />
    <path d="M105 148V182 M88 165H122 M93 153L117 177 M117 153L93 177" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="105" cy="165" r="7" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Disc Brake Caliper -->
    <path d="M96 150C92 154 90 159 90 165" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Front Wheel Assembly -->
  <g id="front-wheel">
    <circle cx="295" cy="165" r="32" fill="#090D16" />
    <circle cx="295" cy="165" r="23" fill="#1E293B" />
    <!-- Sport Aero Alloy Spokes -->
    <circle cx="295" cy="165" r="17" fill="#334155" stroke="#94A3B8" stroke-width="3" />
    <path d="M295 148V182 M278 165H312 M283 153L307 177 M307 153L283 177" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="295" cy="165" r="7" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Disc Brake Caliper -->
    <path d="M286 150C282 154 280 159 280 165" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Main EV Aerodynamic Sedan Body (Pearl White & Electric Accents) -->
  <g id="car-body">
    <!-- Underbody Shield -->
    <path d="M80 162H130C136 152 148 145 162 145H238C252 145 264 152 270 162H325C335 162 342 154 340 144L335 125L325 105C315 95 295 90 270 90H140C110 90 90 98 75 112L55 130C48 136 45 145 48 153C51 160 58 162 68 162H80Z" fill="#0F172A" />

    <!-- Exterior Body Shell -->
    <path d="M52 145C50 135 55 126 64 120L102 95C118 84 135 78 155 76L220 70C240 70 258 76 272 88L320 115C335 124 348 132 355 142L358 147C362 152 358 160 350 160H322C318 148 308 140 295 140C282 140 272 148 268 160H132C128 148 118 140 105 140C92 140 82 148 78 160H60C54 160 50 154 52 145Z" fill="url(#pearlWhiteGradient)" />

    <!-- Metallic Reflection & Highlight -->
    <path d="M72 120L108 97C122 88 138 82 155 80L218 75C235 75 250 80 262 90L308 115C320 122 332 128 340 136" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Aerodynamic Shoulder Line -->
    <path d="M70 126C115 124 220 120 348 126" stroke="#CBD5E1" stroke-width="1.8" />
    <path d="M80 136C120 135 240 133 342 136" stroke="#E2E8F0" stroke-width="1.2" />

    <!-- Panoramic Glass Cabin -->
    <path d="M128 92L162 52C170 42 182 36 195 36H242C255 36 266 42 274 52L298 90H128Z" fill="#0F172A" />
    <!-- Tinted Windshield Glass With Sky Reflection -->
    <path d="M136 88L166 54C172 46 181 42 192 42H215V88H136Z" fill="url(#glassElectricBlue)" />
    <path d="M222 42H240C249 42 258 46 263 54L288 88H222V42Z" fill="url(#glassElectricBlue)" />

    <!-- Thin Pillars -->
    <path d="M218 40V88" stroke="#0F172A" stroke-width="3" />
    <path d="M164 52L134 88" stroke="#0F172A" stroke-width="2.5" />
    <path d="M266 52L292 88" stroke="#0F172A" stroke-width="2.5" />

    <!-- Chrome Window Trim -->
    <path d="M126 90L160 50C169 40 182 34 195 34H242C256 34 268 40 276 50L302 90" stroke="#E2E8F0" stroke-width="1.8" fill="none" />

    <!-- Side Mirrors -->
    <path d="M172 82L158 84C154 85 152 88 154 91C156 94 160 95 164 93L174 88V82Z" fill="#1E293B" stroke="#CBD5E1" stroke-width="1" />

    <!-- Door Cut Lines & Handles -->
    <path d="M192 92V148" stroke="#CBD5E1" stroke-width="1.2" />
    <path d="M255 92V148" stroke="#CBD5E1" stroke-width="1.2" />
    <!-- Flush Electronic Door Handles -->
    <rect x="200" y="112" width="16" height="4" rx="2" fill="#94A3B8" />
    <rect x="263" y="112" width="16" height="4" rx="2" fill="#94A3B8" />

    <!-- Modern LED Headlamp Unit (Pixel Electric Blue Signature) -->
    <path d="M336 126L354 133C358 135 359 139 356 142L344 144C338 144 332 140 330 134L328 128L336 126Z" fill="#F8FAFC" />
    <path d="M332 128L354 135" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="348" cy="136" r="2.5" fill="#38BDF8" />

    <!-- Rear LED Taillight Blade -->
    <path d="M50 142L60 140C64 139 68 141 68 144V148C68 150 64 152 60 152L48 150L50 142Z" fill="#DC2626" />
    <path d="M48 146H62" stroke="#EF4444" stroke-width="2" stroke-linecap="round" />

    <!-- Front Bumper Air Curtain -->
    <path d="M345 146L348 155C348 157 345 159 342 159H335L332 148L345 146Z" fill="#0F172A" />
    <path d="M334 154H344" stroke="#2563EB" stroke-width="1.2" />
  </g>

  <!-- Gradients & Lighting Definitions -->
  <defs>
    <linearGradient id="pearlWhiteGradient" x1="60" y1="50" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F8FAFC" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="glassElectricBlue" x1="160" y1="40" x2="280" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.45" />
    </linearGradient>
  </defs>
</svg>
