<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1425" />
      <stop offset="50%" stop-color="#0F1F3D" />
      <stop offset="100%" stop-color="#070C18" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle Pixel Grid Grid Lines -->
  <path d="M64 128h384M64 256h384M64 384h384M128 64v384M256 64v384M384 64v384" stroke="#2563EB" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Electric Glow Ring -->
  <circle cx="256" cy="256" r="168" stroke="url(#neon)" stroke-width="6" stroke-dasharray="16 12" filter="url(#glow)" opacity="0.85" />

  <!-- Stylized Luxury Car Silhouette -->
  <!-- Roof and windshield -->
  <path d="M168 250 L204 184 C212 170 228 162 245 162 L320 162 C338 162 354 172 362 188 L392 250 Z" fill="#0B1425" stroke="#3B82F6" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Car Cabin Glass Highlight -->
  <path d="M216 238 L238 188 C242 180 250 176 258 176 L310 176 C322 176 332 184 338 196 L356 238 Z" fill="#2563EB" opacity="0.35" />

  <!-- Car Main Sleek Body -->
  <path d="M112 258 C112 250 120 244 130 244 L406 244 C418 244 426 252 426 262 L424 294 C424 306 414 316 402 316 L124 316 C112 316 102 306 102 294 Z" fill="url(#carBody)" />

  <!-- Front & Rear Headlights -->
  <rect x="400" y="260" width="18" height="12" rx="4" fill="#38BDF8" filter="url(#glow)" />
  <rect x="108" y="260" width="14" height="10" rx="3" fill="#EF4444" />

  <!-- Wheels -->
  <circle cx="170" cy="316" r="32" fill="#0B1425" stroke="#2563EB" stroke-width="8" />
  <circle cx="170" cy="316" r="14" fill="#38BDF8" />
  <circle cx="354" cy="316" r="32" fill="#0B1425" stroke="#2563EB" stroke-width="8" />
  <circle cx="354" cy="316" r="14" fill="#38BDF8" />

  <!-- Pixel Syntax Accent Dot Matrix -->
  <rect x="238" y="374" width="8" height="8" rx="2" fill="#38BDF8" />
  <rect x="252" y="374" width="8" height="8" rx="2" fill="#38BDF8" />
  <rect x="266" y="374" width="8" height="8" rx="2" fill="#38BDF8" />
</svg>
